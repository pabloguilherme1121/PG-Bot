name: Qualidade PG Bot

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    name: Navegador ${{ matrix.browser }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}

  catalog-parity:
    name: Comparar catálogo com Arcade e Estratégia
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pabloguilherme1121/PG-Arcade
          path: external/PG-Arcade
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: pabloguilherme1121/PG-Estrategia
          path: external/PG-Estrategia
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Conferir IDs e destinos dos catálogos
        run: node scripts/audit-catalog.mjs --arcade-root=external/PG-Arcade --strategy-root=external/PG-Estrategia
